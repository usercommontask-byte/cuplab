<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play & Talk - CupLab | Live Game Lobby</title>
<meta name="robots" content="noindex, nofollow">

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #ff6b6b;
  --chess: #9b59b6;
  --chess-dark: #8e44ad;
  --dark: #1a1a2e;
  --dark2: #16213e;
  --dark3: #0f3460;
  --white: #eee;
  --gray: #a8a8a8;
  --green: #26de81;
  --red: #e74c3c;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--dark);
  color: var(--white);
  /* Strict Native App Lockout */
  height: 100dvh;
  min-height: 100vh;
  overflow: hidden; 
  display: flex;
  flex-direction: column;
}

.header {
  background: rgba(26, 26, 46, 0.95);
  border-bottom: 2px solid var(--chess);
  padding: 0.8rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0; /* Never shrink header */
}

.logo {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--chess);
  text-decoration: none;
}
.logo::before { content: '🎮 '; } 

.home-btn {
  background: transparent;
  border: 2px solid var(--gray);
  color: var(--gray);
  padding: 0.5rem 1.2rem;
  border-radius: 20px;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.3s;
}

.home-btn:hover { border-color: var(--primary); color: var(--primary); }

/* MATCHING SCREEN */
.matching {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
}

.spinner {
  width: 80px;
  height: 80px;
  border: 5px solid var(--dark3);
  border-top: 5px solid var(--chess);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 2rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

.cancel-btn {
  margin-top: 2rem;
  background: transparent;
  border: 2px solid var(--gray);
  color: var(--gray);
  padding: 0.8rem 2.5rem;
  border-radius: 25px;
  cursor: pointer;
  font-weight: 700;
}

/* GAME SCREEN LAYOUT */
.game-screen {
  display: none;
  flex: 1;
  min-height: 0; /* Crucial for internal flex scrolling/sizing */
  padding: 0.5rem;
  gap: 0.5rem;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

/* VIDEO SECTION */
.video-section {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.video-box {
  background: var(--dark2);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  border: 2px solid var(--dark3);
  aspect-ratio: 4/3;
  width: 100%;
  display: flex;
  justify-content: center;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-label {
  position: absolute;
  bottom: 8px;
  left: 8px;
  background: rgba(0,0,0,0.6);
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
}

.ctrl-btn {
  padding: 0.7rem 1rem;
  border-radius: 20px;
  border: none;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  background: var(--dark3);
  color: white;
  text-align: center;
}

.ctrl-btn.active { background: var(--chess); }
.ctrl-btn.danger { background: var(--red); }
.ctrl-btn:hover { filter: brightness(1.2); }

/* CHESS / LOBBY SECTION */
.chess-section {
  flex: 1;
  min-height: 0; /* Allows content to squeeze */
  display: flex;
  flex-direction: column;
  background: var(--dark2);
  padding: 0.8rem;
  border-radius: 15px;
  border: 2px solid var(--dark3);
  overflow: hidden; /* Lock content inside */
}

/* GAME WRAPPERS (Shared Flex Layout) */
#chessGameWrapper, #tttGameWrapper {
  width: 100%;
  height: 100%;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

/* ==================================
   LOBBY UI
=================================== */
#lobbyMenu {
  width: 100%;
  height: 100%;
  text-align: center;
  padding: 1rem 0;
  overflow-y: auto;
}

.lobby-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1rem;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
}

.game-card {
  background: var(--dark3);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 1.5rem 0.5rem;
  cursor: pointer;
  transition: all 0.3s;
}

.game-card:hover {
  transform: translateY(-5px);
  border-color: var(--chess);
  background: rgba(155, 89, 182, 0.15);
}

.card-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.game-card h3 { font-size: 1.1rem; margin-bottom: 0.3rem; color: var(--chess); }
.game-card p { font-size: 0.8rem; color: var(--gray); }

/* ==================================
   STATUS BAR
=================================== */
.status-bar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--dark);
  padding: 0.6rem 1rem;
  border-radius: 10px;
  flex-shrink: 0;
}

#gameStatus, #tttStatusText {
  font-size: 1rem;
  font-weight: 800;
  color: var(--chess);
}

/* ==================================
   RESPONSIVE BOARDS
=================================== */
#board {
  width: 100%;
  /* Force board to scale down to fit vertical height! */
  max-width: min(100%, 42vh); 
  margin: auto;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

.white-1e1d7 { background-color: #f0d9b5; color: #b58863; }
.black-3c85d { background-color: #b58863; color: #f0d9b5; }
.highlight-square { box-shadow: inset 0 0 5px 4px rgba(255, 235, 59, 0.8) !important; }

/* TIC-TAC-TOE UI */
.ttt-board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
  max-width: min(100%, 42vh);
  margin: auto;
  background: var(--dark3);
  padding: 8px;
  border-radius: 12px;
}

.ttt-cell {
  background: var(--dark);
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(2rem, 8vh, 4rem);
  font-weight: 900;
  cursor: pointer;
  border-radius: 8px;
}

.ttt-cell.x { color: var(--primary); }
.ttt-cell.o { color: var(--green); }

/* ==================================
   DESKTOP VS MOBILE MEDIA QUERIES
=================================== */
@media (min-width: 800px) {
  .game-screen { flex-direction: row; padding: 1.5rem; gap: 1.5rem; }
  .video-section { flex: 0 0 320px; }
  #board, .ttt-board { max-width: min(100%, 60vh); } /* Taller boards for desktop */
}

@media (max-width: 799px) {
  .game-screen { flex-direction: column; overflow: hidden; }
  
  /* Lock Videos to Top Row */
  .video-section { 
    flex-direction: row; 
    flex-wrap: wrap; 
    flex-shrink: 0; 
  }
  .video-box { 
    width: calc(50% - 0.25rem); /* Two boxes side by side */
  }
  .controls { 
    width: 100%; 
    flex-shrink: 0; 
  }
  .ctrl-btn { 
    flex: 1; 
    padding: 0.6rem 0; 
    font-size: 0.85rem; 
  }
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">CupLab Games</a>
  <a href="index.html" class="home-btn">Leave Match</a>
</div>

<div class="matching" id="matchingScreen">
  <div class="spinner"></div>
  <h2>Finding an Opponent...</h2>
  <p>Looking for someone to play Games and Chat with you.</p>
  <button class="cancel-btn" onclick="window.location.href='index.html'">Cancel</button>
</div>

<div class="game-screen" id="gameScreen">
  
  <div class="video-section">
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-label">Stranger</div>
    </div>
    
    <div class="video-box">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-label">You</div>
    </div>

    <div class="controls">
      <button class="ctrl-btn active" id="micBtn" onclick="toggleAudio()">🎙️ Mic On</button>
      <button class="ctrl-btn active" id="camBtn" onclick="toggleVideo()">📹 Cam On</button>
      <button class="ctrl-btn danger" onclick="nextOpponent()">⏭️ Next</button>
    </div>
  </div>

  <div class="chess-section">
    
    <div id="lobbyMenu">
      <h2 style="margin-bottom: 0.5rem; font-size: 1.8rem;">Choose a Game</h2>
      <p style="color: var(--gray); margin-bottom: 1.5rem; font-size: 0.9rem;">Pick a game to start playing.</p>
      
      <div class="lobby-grid">
        <div class="game-card" onclick="startGame('chess')">
          <div class="card-icon">♟️</div>
          <h3>Chess</h3>
          <p>Classic strategy.</p>
        </div>
        <div class="game-card" onclick="startGame('ttt')">
          <div class="card-icon">❌</div>
          <h3>Tic-Tac-Toe</h3>
          <p>Quick and casual.</p>
        </div>
      </div>
    </div>

    <div id="chessGameWrapper" style="display: none;">
      <div class="status-bar">
        <div id="gameStatus">White to move</div>
        <div id="playerRole">Role: <strong>...</strong></div>
      </div>
      
      <div id="board"></div>
      
      <button class="ctrl-btn danger" onclick="exitToLobby()" style="width: 100%; flex-shrink: 0; margin-top: 0.5rem;">🚪 Return to Lobby</button>
    </div>

    <div id="tttGameWrapper" style="display: none;">
      <div class="status-bar">
        <div id="tttStatusText">X's Turn</div>
        <div id="tttRole">Role: <strong>...</strong></div>
      </div>

      <div class="ttt-board" id="tttBoard"></div>

      <div style="display: flex; gap: 0.5rem; width: 100%; flex-shrink: 0; margin-top: 0.5rem;">
        <button class="ctrl-btn" onclick="resetTtt()" style="flex: 1; background: var(--dark3); color: white;">🔄 Play Again</button>
        <button class="ctrl-btn danger" onclick="exitToLobby()" style="flex: 1;">🚪 Lobby</button>
      </div>
    </div>

  </div>

</div>

<script>
// --- GLOBAL VARIABLES ---
const SERVER_URL = window.location.origin;
let socket = null;
let myColor = 'white'; 

// Chess Variables
let board = null;
let game = new Chess();
let selectedSquare = null; 

// Tic-Tac-Toe Variables
let tttBoardState = ['', '', '', '', '', '', '', '', ''];
let myTttSymbol = 'X';
let currentTttTurn = 'X';
let tttGameOver = false;

// WebRTC Variables
let localStream;
let peerConnection;
const servers = {
  iceServers: [
    { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
  ]
};

// --- INITIALIZATION ---
window.onload = async function() {
  await setupLocalMedia();
  initSocket();
};

// --- CAMERA / MIC SETUP ---
async function setupLocalMedia() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
  } catch (error) {
    alert("Camera/Microphone access is required to Play & Talk. Please enable permissions and refresh.");
    console.error("Media error:", error);
  }
}

// --- SOCKET & MATCHMAKING ---
function initSocket() {
  socket = io(SERVER_URL);

  socket.on('connect', () => {
    socket.emit('find_partner', 'chess');
  });

  socket.on('matched', async (data) => {
    myColor = data.color;
    
    document.getElementById('matchingScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    
    enterLobbyUI();
    setupWebRTC(data.role);
  });

  socket.on('stranger_disconnected', () => {
    alert("Your partner left.");
    nextOpponent();
  });

  // --- LOBBY SIGNALING ---
  socket.on('game_selected', (gameName) => {
    enterGameUI(gameName);
  });

  socket.on('return_to_lobby', () => {
    enterLobbyUI();
  });

  // --- WEBRTC SIGNALING HANDLERS ---
  socket.on('webrtc_offer', async (offer) => {
    if(!peerConnection) return;
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('webrtc_answer', answer);
  });

  socket.on('webrtc_answer', async (answer) => {
    if(!peerConnection) return;
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
  });

  socket.on('webrtc_ice_candidate', async (candidate) => {
    if(!peerConnection) return;
    try {
      await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    } catch (e) { console.error('Error adding received ice candidate', e); }
  });

  // --- GAME MOVES (HIJACKED FOR BOTH CHESS AND TTT) ---
  socket.on('chess_move', (data) => {
    if (data && data.type === 'ttt') {
        processTttMove(data.index, data.symbol);
    } else if (data && data.type === 'ttt_reset') {
        initTttBoard();
    } else {
        game.move(data);
        board.position(game.fen());
        updateStatus();
        removeHighlights(); 
    }
  });
}

// --- GAME LOBBY LOGIC ---
function startGame(gameName) {
  socket.emit('select_game', gameName);
  enterGameUI(gameName);
}

function exitToLobby() {
  socket.emit('exit_game');
  enterLobbyUI();
}

function enterLobbyUI() {
  document.getElementById('chessGameWrapper').style.display = 'none';
  document.getElementById('tttGameWrapper').style.display = 'none';
  document.getElementById('lobbyMenu').style.display = 'block';
  
  if (board) { board.destroy(); board = null; }
  selectedSquare = null;
}

function enterGameUI(gameName) {
  document.getElementById('lobbyMenu').style.display = 'none';
  
  if (gameName === 'chess') {
    document.getElementById('chessGameWrapper').style.display = 'flex';
    document.getElementById('playerRole').innerHTML = `<strong style="color:${myColor === 'white' ? '#fff' : '#333'}">${myColor.toUpperCase()}</strong>`;
    initChessBoard();
    updateStatus();
    // Force chessboard to recalculate size now that it's visible
    setTimeout(() => { if(board) board.resize(); }, 100); 
  } else if (gameName === 'ttt') {
    document.getElementById('tttGameWrapper').style.display = 'flex';
    myTttSymbol = (myColor === 'white') ? 'X' : 'O'; 
    document.getElementById('tttRole').innerHTML = `<strong style="color:${myTttSymbol === 'X' ? 'var(--primary)' : 'var(--green)'}">${myTttSymbol}</strong>`;
    initTttBoard();
  }
}

// --- WEBRTC PEER CONNECTION ---
function setupWebRTC(role) {
  peerConnection = new RTCPeerConnection(servers);

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  peerConnection.ontrack = (event) => {
    document.getElementById('remoteVideo').srcObject = event.streams[0];
  };

  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('webrtc_ice_candidate', event.candidate);
    }
  };

  if (role === 'initiator') {
    peerConnection.createOffer()
      .then(offer => {
        peerConnection.setLocalDescription(offer);
        socket.emit('webrtc_offer', offer);
      });
  }
}

// ==========================================
// TIC-TAC-TOE LOGIC
// ==========================================
function initTttBoard() {
  tttBoardState = ['', '', '', '', '', '', '', '', ''];
  currentTttTurn = 'X';
  tttGameOver = false;
  updateTttStatus();
  renderTttBoard();
}

function renderTttBoard() {
  const boardDiv = document.getElementById('tttBoard');
  boardDiv.innerHTML = '';
  tttBoardState.forEach((cell, index) => {
    const cellDiv = document.createElement('div');
    cellDiv.className = 'ttt-cell ' + (cell === 'X' ? 'x' : (cell === 'O' ? 'o' : ''));
    cellDiv.innerText = cell;
    cellDiv.onclick = () => makeTttMove(index);
    boardDiv.appendChild(cellDiv);
  });
}

function makeTttMove(index) {
  if (tttGameOver || tttBoardState[index] !== '' || currentTttTurn !== myTttSymbol) return;
  socket.emit('chess_move', { type: 'ttt', index: index, symbol: myTttSymbol });
  processTttMove(index, myTttSymbol);
}

function processTttMove(index, symbol) {
  tttBoardState[index] = symbol;
  currentTttTurn = (symbol === 'X') ? 'O' : 'X';
  renderTttBoard();
  checkTttWin();
}

function checkTttWin() {
  const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  for (let pattern of winPatterns) {
    const [a, b, c] = pattern;
    if (tttBoardState[a] && tttBoardState[a] === tttBoardState[b] && tttBoardState[a] === tttBoardState[c]) {
      document.getElementById('tttStatusText').innerText = `${tttBoardState[a]} Wins!`;
      tttGameOver = true;
      return;
    }
  }

  if (!tttBoardState.includes('')) {
    document.getElementById('tttStatusText').innerText = "It's a Draw!";
    tttGameOver = true;
    return;
  }
  updateTttStatus();
}

function updateTttStatus() {
  if (tttGameOver) return;
  if (currentTttTurn === myTttSymbol) {
    document.getElementById('tttStatusText').innerText = "Your Turn!";
  } else {
    document.getElementById('tttStatusText').innerText = "Waiting...";
  }
}

function resetTtt() {
  socket.emit('chess_move', { type: 'ttt_reset' });
  initTttBoard();
}

// ==========================================
// CHESS LOGIC (TAP TO MOVE)
// ==========================================
function initChessBoard() {
  game.reset();
  selectedSquare = null;
  const config = {
    draggable: false, 
    position: 'start',
    orientation: myColor,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
  };
  board = Chessboard('board', config);
}

$(document).on('click', '#board .square-55d63', function() {
  if (game.game_over() || $('#chessGameWrapper').css('display') === 'none') return;
  
  let square = $(this).attr('data-square');
  let turnColor = game.turn() === 'w' ? 'white' : 'black';
  if (turnColor !== myColor) return;
  
  let piece = game.get(square);

  if (selectedSquare === null) {
    if (piece && piece.color === game.turn()) {
      selectedSquare = square;
      highlightSquare(square);
    }
  } else {
    let move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
    if (move === null) {
      if (piece && piece.color === game.turn()) {
        selectedSquare = square;
        highlightSquare(square);
      } else {
        selectedSquare = null;
        removeHighlights();
      }
    } else {
      selectedSquare = null;
      removeHighlights();
      socket.emit('chess_move', move);
      board.position(game.fen());
      updateStatus();
    }
  }
});

function highlightSquare(square) {
  $('#board .square-55d63').removeClass('highlight-square');
  $('#board .square-' + square).addClass('highlight-square');
}

function removeHighlights() {
  $('#board .square-55d63').removeClass('highlight-square');
}

function updateStatus () {
  let statusHTML = '';
  let moveColor = game.turn() === 'w' ? 'White' : 'Black';

  if (game.in_checkmate()) {
    statusHTML = `Game over, ${moveColor} checkmate.`;
  } else if (game.in_draw()) {
    statusHTML = 'Game drawn';
  } else {
    statusHTML = `${moveColor} to move`;
    if (game.in_check()) statusHTML += ', in check';
  }
  document.getElementById('gameStatus').innerText = statusHTML;
}

// --- UI CONTROLS ---
function toggleAudio() {
  const audioTrack = localStream.getAudioTracks()[0];
  const btn = document.getElementById('micBtn');
  if (audioTrack.enabled) {
    audioTrack.enabled = false;
    btn.innerText = '🔇 Mic Off';
    btn.classList.remove('active');
  } else {
    audioTrack.enabled = true;
    btn.innerText = '🎙️ Mic On';
    btn.classList.add('active');
  }
}

function toggleVideo() {
  const videoTrack = localStream.getVideoTracks()[0];
  const btn = document.getElementById('camBtn');
  if (videoTrack.enabled) {
    videoTrack.enabled = false;
    btn.innerText = '📷 Cam Off';
    btn.classList.remove('active');
  } else {
    videoTrack.enabled = true;
    btn.innerText = '📹 Cam On';
    btn.classList.add('active');
  }
}

function nextOpponent() {
  socket.emit('leave_chat');
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  document.getElementById('remoteVideo').srcObject = null;
  
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('matchingScreen').style.display = 'flex';
  
  enterLobbyUI();
  
  setTimeout(() => {
    socket.emit('find_partner', 'chess');
  }, 1000);
}

// Window resize listener to ensure chessboard fits correctly
window.addEventListener('resize', () => {
    if(board && document.getElementById('chessGameWrapper').style.display !== 'none') {
        board.resize();
    }
});
</script>

</body>
</html>
